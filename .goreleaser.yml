# GoReleaser v2. `goreleaser check` validates this file; run it before tagging,
# because every one of the v1-to-v2 breaking changes fails only at release
# time, which is after the tag is already spent.
version: 2
before:
  hooks:
    # Deliberately not `go mod tidy`: a hook that can modify go.mod/go.sum
    # aborts the release on a dirty worktree.
    - go mod download
builds:
  - env:
      # goreleaser does not work with CGO, and it would complicate use in
      # CI/CD systems where users cannot install libraries.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # --batch because this runs unattended in CI.
      - --batch
      - --local-user
      - '{{ .Env.GPG_FINGERPRINT }}'
      - --output
      - ${signature}
      # Detached and BINARY. Adding --armor breaks registry ingestion.
      - --detach-sign
      - ${artifact}
release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # Kept on permanently. A published registry version can never be replaced,
  # so the last gate before a permanent mistake is a human clicking publish.
  # If a draft is wrong: delete the draft release, delete the remote tag, then
  # re-push the tag. Skipping the tag deletion is what makes a re-run
  # impossible.
  draft: true
changelog:
  disable: true
